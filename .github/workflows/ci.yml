name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  extension-version:
    name: Extension version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a version bump for this PR update
        env:
          EVENT_ACTION: ${{ github.event.action }}
          PREVIOUS_HEAD: ${{ github.event.before }}
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          compare_ref="$BASE_REF"
          if [ "$EVENT_ACTION" = "synchronize" ] && [ -n "$PREVIOUS_HEAD" ]; then
            if ! git cat-file -e "${PREVIOUS_HEAD}^{commit}" 2>/dev/null; then
              if ! git fetch --no-tags --depth=1 origin "$PREVIOUS_HEAD"; then
                echo "::error::Unable to fetch the previous PR head; refusing to weaken the version check."
                exit 1
              fi
            fi
            compare_ref="$PREVIOUS_HEAD"
          fi
          npm run version:check -- "$compare_ref"

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade build pip
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      # Both console scripts must keep working: the new primary name and the
      # backward-compatible alias.
      - run: sql-file-detection-tool --version
      - run: external-file-detector --version
      - name: Default target platform must be Azure SQL Database
        run: |
          python -c "from external_file_detection import DEFAULT_TARGET_PLATFORM as p; assert p == 'azure_sql_db', p; print(p)"

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The notices must describe the bundle that was just built, not a bundle
      # from whenever someone last remembered to regenerate them.
      - run: npm run notices -- --check
      # Production dependencies only: the packaging toolchain is not shipped.
      # Gated at `high` so an upstream low/moderate advisory reds the build for
      # the maintainer to triage on a schedule rather than blocking an unrelated
      # pull request. `npm audit --omit=dev` with no gate is the local command.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run package
      # Mechanical proof that the package carries no Python, no sources, no
      # fixtures and no credentials.
      - run: npm run audit:vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix
          if-no-files-found: error
